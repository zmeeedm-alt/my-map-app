<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя Карта</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        #map { height: 100vh; width: 100vw; }
        
        /* Стили для карточки с постом */
        .popup-card { text-align: center; max-width: 210px; }
        .popup-card img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; margin-bottom: 6px; }
        .popup-card h3 { margin: 4px 0; font-size: 15px; color: #111; }
        .popup-card p { font-size: 12px; color: #555; margin: 0 0 10px 0; line-height: 1.3; }
        .popup-btn {
            display: block;
            background: #2481cc;
            color: #ffffff !important;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
        }

        /* Кнопка "Где я?" */
        .locate-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000;
            background: white;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .locate-btn:active { background: #f0f0f0; }
    </style>
</head>
<body>
    <div id="map"></div>
    <button class="locate-btn" id="locateBtn" title="Мое местоположение">📍</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // 1. Создаем карту (начальный центр)
        const map = L.map('map').setView([14.800000, 108.800000], 7);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19
        }).addTo(map);

        // 2. Ваши метки
        const places = [
            {
                lat: 13.788035414850954,
                lng: 109.29028625767052,
                title: "Мыс у Куйнена",
                desc: "Локация не самая известная, надо будет идти через кладбище, в комментариях на гугл картах есть описание маршрута, ориентируетесь на него.",
                image: "https://i.ibb.co/tTtwBmn1/2026-07-30-19-14-09.jpg",
                postUrl: "https://t.me/away_journal/62"
            },
            {
                lat: 16.003865095351337,
                lng: 108.2632141441763,
                title: "Мраморные горы, Дананг",
                desc: "На окраине города есть система гор. Их пять и они символизируют элементы - вода, земля, огонь, металл, дерево.",
                image: "https://i.ibb.co/hJh47VM0/2026-07-30-19-18-33.jpg",
                postUrl: "https://t.me/away_journal/89"
            },
            {
                lat: 11.947853106820741,
                lng: 108.45749085582268,
                title: "Арт-кафе, Далат",
                desc: "Самое творческое место в Далате, имхо.",
                image: "https://i.ibb.co/03yCZgK/2026-08-06-23-15-19.jpg",
                postUrl: "https://t.me/away_journal/173"
            },
            {
                lat: 22.304126717600642,
                lng: 103.7753003412259,
                title: "Вершина Индокитая",
                desc: "Вершина Фансипан",
                image: "https://i.ibb.co/Z1kh7zfV/2026-08-06-23-19-12.jpg",
                postUrl: "https://t.me/away_journal/14"
            },
            {
                lat: 11.942915357653979,
                lng: 108.43774718465707,
                title: "Суперский секонд, Далат",
                desc: "Самый классный секонд, который я видела, находится в Далате!",
                image: "https://i.ibb.co/twXXpJKS/2026-07-31-21-48-28.jpg",
                postUrl: "https://t.me/away_journal/160"
            }
        ];

        places.forEach(place => {
            const marker = L.marker([place.lat, place.lng]).addTo(map);
            const content = `
                <div class="popup-card">
                    <img src="${place.image}">
                    <h3>${place.title}</h3>
                    <p>${place.desc}</p>
                    <a href="${place.postUrl}" target="_blank" class="popup-btn">📖 Читать пост</a>
                </div>
            `;
            marker.bindPopup(content);
        });

        // Переменные для геолокации
        let userLat = null;
        let userLng = null;
        let userMarker = null;

        // 3. Функция определения геопозиции
        function findUserLocation(autoCenter = false) {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        userLat = position.coords.latitude;
                        userLng = position.coords.longitude;

                        // Если маркера ещё нет — создаем его
                        if (!userMarker) {
                            userMarker = L.circleMarker([userLat, userLng], {
                                color: '#ffffff',
                                weight: 2,
                                fillColor: '#2481cc',
                                fillOpacity: 1,
                                radius: 8
                            }).addTo(map).bindPopup("<b>Вы здесь!</b>");
                        } else {
                            userMarker.setLatLng([userLat, userLng]);
                        }

                        // Если нажата кнопка или стоит авто-центрирование
                        if (autoCenter) {
                            map.flyTo([userLat, userLng], 13);
                        }
                    },
                    (err) => { alert("Не удалось определить местоположение. Проверьте разрешения в телефоне."); }
                );
            }
        }

        // Запускаем поиск геопозиции при старте
        findUserLocation(false);

        // Клик по кнопке "📍" центрирует карту на вас
        document.getElementById('locateBtn').addEventListener('click', () => {
            findUserLocation(true);
        });
    </script>
</body>
</html>
