        html, body { margin: 0; padding: 0; height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        #map { height: 100vh; width: 100vw; }
        
        /* Стили для карточки с постом */
        .popup-card { text-align: center; max-width: 210px; }
        .popup-card img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; margin-bottom: 6px; }
        .popup-card h3 { margin: 4px 0; font-size: 15px; color: #111; }
        .popup-card p { font-size: 12px; color: #555; margin: 0 0 10px 0; line-height: 1.3; }
        .popup-btn {
            display: block;
            background: #2481cc;
            color: #ffffff !important;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
        }

        /* Кнопка "Где я?" */
        .locate-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000;
            background: white;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .locate-btn:active { background: #f0f0f0; }
    </style>
</head>

        places.forEach(place => {
            const marker = L.marker([place.lat, place.lng]).addTo(map);
            const content = `
                <div class="popup-card">
                    <img src="${place.image}">
                    <h3>${place.title}</h3>
                    <p>${place.desc}</p>
                    <a href="${place.postUrl}" target="_blank" class="popup-btn">📖 Читать пост</a>
                </div>
            `;
            marker.bindPopup(content);
        });

        // Переменные для геолокации
        let userLat = null;
        let userLng = null;
        let userMarker = null;

        // 3. Функция определения геопозиции
        function findUserLocation(autoCenter = false) {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        userLat = position.coords.latitude;
                        userLng = position.coords.longitude;

                        // Если маркера ещё нет — создаем его
                        if (!userMarker) {
                            userMarker = L.circleMarker([userLat, userLng], {
                                color: '#ffffff',
                                weight: 2,
                                fillColor: '#2481cc',
                                fillOpacity: 1,
                                radius: 8
                            }).addTo(map).bindPopup("<b>Вы здесь!</b>");
                        } else {
                            userMarker.setLatLng([userLat, userLng]);
                        }

                        // Если нажата кнопка или стоит авто-центрирование
                        if (autoCenter) {
                            map.flyTo([userLat, userLng], 13);
                        }
                    },
                    (err) => { alert("Не удалось определить местоположение. Проверьте разрешения в телефоне."); }
                );
            }
        }

        // Запускаем поиск геопозиции при старте
        findUserLocation(false);

        // Клик по кнопке "📍" центрирует карту на вас
        document.getElementById('locateBtn').addEventListener('click', () => {
            findUserLocation(true);
        });
