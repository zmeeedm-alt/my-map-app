<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // 1. Инициализация карты (по умолчанию центр — Москва или Вьетнам)
    const map = L.map('map').setView([13.7878687, 109.2902648], 11);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
    }).addTo(map);

    // 2. Список ваших интересных мест
    const places = [
        {
            lat: 13.788035414850954,
            lng: 109.29028625767052,
            title: "Мыс у Куйнена",
            desc: "Вид на скалы и океан",
            image: "https://i.ibb.co/tTtwBmn1/2026-07-30-19-14-09.jpg",
            postUrl: "https://t.me/away_journal/62"
        },
        {
            lat: 16.003865095351337,
            lng: 108.2632141441763,
            title: "Мраморные горы, Дананг",
            desc: "На окраине города есть система гор. Их пять и они символизируют элементы - вода, земля, огонь, металл, дерево",
            image: "https://i.ibb.co/hJh47VM0/2026-07-30-19-18-33.jpg",
            postUrl: "https://t.me/away_journal/89"
        }
    ];

    // Отрисовываем ваши места
    places.forEach(place => {
        const marker = L.marker([place.lat, place.lng]).addTo(map);
        const content = `
            <div class="popup-card">
                <img src="${place.image}">
                <h3>${place.title}</h3>
                <p>${place.desc}</p>
                <a href="${place.postUrl}" target="_blank" class="popup-btn">Открыть пост</a>
            </div>
        `;
        marker.bindPopup(content);
    });

    // 3. 📍 ОПРЕДЕЛЕНИЕ ГЕОЛОКАЦИИ ПОЛЬЗОВАТЕЛЯ
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (position) => {
                const userLat = position.coords.latitude;
                const userLng = position.coords.longitude;

                // Создаем синий кружок в точке пользователя
                const userLocationMarker = L.circleMarker([userLat, userLng], {
                    color: '#1a73e8',       // Синяя обводка
                    fillColor: '#4285f4',   // Синяя заливка
                    fillOpacity: 0.9,
                    radius: 8               // Размер кружка
                }).addTo(map);

                userLocationMarker.bindPopup("<b>Вы здесь!</b>");

                // Перемещаем карту к пользователю (по желанию)
                // map.setView([userLat, userLng], 12);
            },
            (error) => {
                console.log("Пользователь запретил доступ к геопозиции или произошла ошибка:", error);
            }
        );
    }
</script>
